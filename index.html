<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal Web OS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Lock / Welcome Screen -->
  <div id="welcome-screen" class="screen">
    <div class="card">
      <h1>Welcome to My OS</h1>
      <p>Explore my personal interactive web portfolio.</p>
      <button id="enter-btn">Enter OS</button>
    </div>
  </div>

  <!-- Main OS Environment -->
  <div id="desktop" class="hidden">
    
    <!-- Top Bar -->
    <header class="top-bar">
      <div class="os-logo-group">
        <span class="os-logo">WebOS</span>
        <span class="top-bar-greeting">heloo</span>
        <button id="theme-toggle" class="theme-btn" title="Toggle Theme">🌙</button>
      </div>
      <div class="top-bar-right">
        <span id="date"></span>
        <span id="clock">00:00:00 AM</span>
      </div>
    </header>

    <!-- Centered Desktop Text -->
    <div class="center-text">
      hey its piyushoutthere
    </div>

    <!-- Desktop Icons -->
    <main class="workspace">
      <div class="icon" id="open-app-about">
        <div class="icon-img">📁</div>
        <span>About Me</span>
      </div>

      <div class="icon" id="open-app-notes">
        <div class="icon-img">📝</div>
        <span>Notes</span>
      </div>

      <div class="icon" id="open-app-calc">
        <div class="icon-img">🧮</div>
        <span>Calculator</span>
      </div>

      <div class="icon" id="open-app-terminal">
        <div class="icon-img">💻</div>
        <span>Terminal</span>
      </div>

      <div class="icon" id="open-app-timer">
        <div class="icon-img">⏱️</div>
        <span>Timer</span>
      </div>

      <div class="icon" id="open-app-music">
        <div class="icon-img">🎵</div>
        <span>Music Player</span>
      </div>

      <div class="icon" id="open-app-snake">
        <div class="icon-img">🐍</div>
        <span>Snake Game</span>
      </div>

      <div class="icon" id="open-app-ttt">
        <div class="icon-img">❌</div>
        <span>Tic-Tac-Toe</span>
      </div>

      <div class="icon" id="open-app-weather">
        <div class="icon-img">🌤️</div>
        <span>Weather</span>
      </div>

      <div class="icon" id="open-app-settings">
        <div class="icon-img">⚙️</div>
        <span>Settings</span>
      </div>
    </main>

    <!-- Container for Multiple Draggable Windows -->
    <div id="windows-container"></div>

  </div>

  <script src="script.js"></script>
</body>
</html>
