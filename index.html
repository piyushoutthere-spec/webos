<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Piyush WebOS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Lock / Welcome Screen -->
  <div id="welcome-screen">
    <h1>Welcome to Piyush OS</h1>
    <button id="enter-btn">Enter OS</button>
  </div>

  <!-- Main Desktop Container -->
  <div id="desktop" class="hidden">
    
    <!-- Top Bar -->
    <div id="top-bar">
      <span>PiyushOS</span>
      <button id="theme-toggle">Theme</button>
      <div id="clock-box">
        <span id="clock"></span>
        <span id="date"></span>
      </div>
    </div>

    <!-- Desktop App Icons -->
    <div id="icon-grid">
      <button id="open-app-about">About</button>
      <button id="open-app-notes">Notes</button>
      <button id="open-app-calc">Calc</button>
      <button id="open-app-terminal">Terminal</button>
      <button id="open-app-timer">Timer</button>
      <button id="open-app-music">Music</button>
      <button id="open-app-snake">Snake</button>
      <button id="open-app-ttt">TicTacToe</button>
    </div>

    <!-- Window Manager Space -->
    <div id="windows-container"></div>

  </div>

  <script src="script.js"></script>
</body>
</html>
